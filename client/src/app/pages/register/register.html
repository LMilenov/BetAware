
<div class="register-page">
  <div class="register-card">
    <a class="brand" routerLink="/">
      <span class="brand-icon">B</span>
      <span>Bet<span class="brand-accent">Aware</span></span>
    </a>

    <div class="heading">
      <p class="eyebrow">START YOUR JOURNEY</p>
      <h1>Create your account</h1>
      <p class="subtitle">
        Build healthier habits and take control of your financial future.
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="displayName">Full name</label>
        <input
          id="displayName"
          type="text"
          name="displayName"
          [(ngModel)]="displayName"
          placeholder="Your full name"
          autocomplete="name"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="At least 6 characters"
          autocomplete="new-password"
          minlength="6"
          required
        />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          placeholder="Repeat your password"
          autocomplete="new-password"
          required
        />
      </div>

      @if (error()) {
        <p class="error-message" role="alert">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading() || !registerForm.valid"
      >
        @if (loading()) {
          Creating account...
        } @else {
          Create account <span aria-hidden="true">→</span>
        }
      </button>
    </form>

    <p class="login-prompt">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>

    <a class="back-link" routerLink="/">← Back to dashboard</a>
  </div>
</div>
